<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width={% extends "base.html" %}

{% block title %}Chi tiết sách{% endblock %}

{% block content %}

<h1>{{ book.title }}</h1>

<p>
    <strong>ID:</strong>
    {{ book.id }}
</p>

<p>
    <strong>Tác giả:</strong>
    {{ book.author }}
</p>

<p>
    <strong>Năm xuất bản:</strong>
    {{ book.year }}
</p>

<p>
    <strong>Thể loại:</strong>
    {{ book.category }}
</p>

<p>
    <strong>Tình trạng:</strong>

    {% if book.available %}
        Sẵn sàng cho mượn
    {% else %}
        Đang được mượn
    {% endif %}
</p>

<p>
    <a href="{{ url_for('books') }}">
        ← Quay lại danh sách
    </a>
</p>

{% endblock %}, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
</body>
</html>
